<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>Drawing App JavaScript</title>
    <link rel="stylesheet" href="assets/style.css">
    <link rel="stylesheet" href="assets/i18n.css">
    <link rel="stylesheet" href="assets/pwa.css">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" href="icons/favicon-32.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="theme-color" content="#4A98F7">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" defer></script>
    <script src="assets/i18n.js" defer></script>
    <script src="assets/pwa.js" defer></script>
  </head>
  <body>
    <div class="lang-toggle" role="group" aria-label="Language / Linguagem">
      <button type="button" class="lang-btn" data-lang="pt">PT</button>
      <button type="button" class="lang-btn" data-lang="en">EN</button>
    </div>
    <button type="button" class="install-btn" data-i18n="installApp" hidden>Install App</button>
    <div class="container">
      <section class="tools-board">
        <div class="row">
            <h1 class="title" data-i18n="tools">TOOLS</h1>
          <label class="title" data-i18n="shapes">Shapes</label>
          <ul class="options">
            <li class="option tool" id="rectangle">
              <img src="icons/rectangle.svg" alt="Rectangle" data-i18n-alt="rectangle">
              <span data-i18n="rectangle">Rectangle</span>
            </li>
            <li class="option tool" id="circle">
              <img src="icons/circle.svg" alt="Circle" data-i18n-alt="circle">
              <span data-i18n="circle">Circle</span>
            </li>
            <li class="option tool" id="triangle">
              <img src="icons/triangle.svg" alt="Triangle" data-i18n-alt="triangle">
              <span data-i18n="triangle">Triangle</span>
            </li>
            <li class="option tool" id="polygon">
               <img src="icons/polygone.svg" alt="Polygon" data-i18n-alt="polygon">
               <span data-i18n="polygon">Polygon</span>
            </li>
            <li class="option polygon-sides">
                  <label for="polygon-sides" data-i18n="polygonSides"> Sides </label>
                  <input type="number" id="polygon-sides" min="3" max="20" value="5">
              </li>
              <li class="option tool" id="line">
              <img src="icons/line.svg" alt="Line" data-i18n-alt="line">
              <span data-i18n="line">Line</span>
            </li>
            <li class="option tool" id="random-draw">
              <img src="icons/question_mark.svg" alt="Random Draw" data-i18n-alt="randomDraw">
              <span data-i18n="randomDraw">Random Draw</span>
            </li>
            <li class="option">
              <input type="checkbox" id="fill-color">
              <label for="fill-color" data-i18n="fillColor">Fill color</label>
            </li>
          </ul>
        </div>
        <div class="row">
          <label class="title" data-i18n="options">Options</label>
          <ul class="options">
            <li class="option active tool" id="brush">
              <img src="icons/brush.svg" alt="Brush" data-i18n-alt="brush">
              <span data-i18n="brush">Brush</span>
            </li>
            <li class="option tool" id="eraser">
              <img src="icons/eraser.svg" alt="Eraser" data-i18n-alt="eraser">
              <span data-i18n="eraser">Eraser</span>
            </li>
            <li class="option tool" id="spray">
              <img src="icons/spray.svg" alt="Spray" data-i18n-alt="spray">
              <span data-i18n="spray">Spray</span>
            </li>
            <li class="option">
              <input type="range" id="size-slider" min="1" max="30" value="5">
            </li>
          </ul>
        </div>
        <div class="row colors">
          <label class="title" data-i18n="colors">Colors</label>
          <ul class="options">
            <li class="option"></li>
            <li class="option selected"></li>
            <li class="option"></li>
            <li class="option"></li>
            <!-- Botão de cor personalizada HSV -->
            <li class="option custom-color" id="custom-color-button" data-default-color="#4A98F7">
            </li>
          </ul>
           <!-- Componentes do slider de HSV -->
            <div class="hsv-picker" id="hsv-picker">
              <div class="hsv-row">
                  <!-- Deslizador para a matiz -->
                  <label for="hue-slider">H</label>
                  <input type="range" id="hue-slider" min="0" max="360" value="213">
                  <span id="hue-value">213°</span>
              </div>
              <div class="hsv-row">
                <!-- Deslizador para a saturação -->
                <label for="saturation-slider">S</label>
                <input type="range" id="saturation-slider"min="0" max="100" value="70">
                <span id="saturation-value">70%</span>
              </div>
              <div class="hsv-row">
                <!-- Deslizador para o valor -->
                <label for="value-slider">V</label>
                <input type="range" id="value-slider" min="0" max="100" value="97">
                <span id="value-value">97%</span>
              </div>
              <div class="hsv-preview" id="hsv-preview"></div>
              <!-- Botão para resetar -->
              <button type="button" id="reset-color" data-i18n="resetColor">Reset</button>
            </div>
        </div>
        <div class="row buttons">
            <button class="undo-btn" data-i18n="undo" disabled>Undo</button>
            <button class="redo-btn" data-i18n="redo" disabled>Redo</button>
            <button class="reset-zoom" data-i18n="resetZoom">Zoom 100%</button>
            <button class="clear-canvas" data-i18n="clearCanvas">Clear Workspace</button>
            <button class="save-img" data-i18n="saveImg">Save As Image</button>
        </div>
      </section>
      <section class="drawing-board">
        <canvas></canvas>
      </section>
    </div>
  </body>
</html>
